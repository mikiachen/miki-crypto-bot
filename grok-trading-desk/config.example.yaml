# grok-trading-desk — example configuration.
# Copy to config.yaml and fill in secrets. config.yaml is gitignored.

mode: "paper"            # "paper" | "live". "live" additionally requires --i-understand-the-risk

grok:
  api_key: "xai-REPLACE_ME"
  base_url: "https://api.x.ai/v1/chat/completions"
  models:
    # grok-4-fast / grok-4 were retired 2026-05-15; both now redirect to
    # grok-4.3, which quietly made the "checker runs a stronger model" premise
    # false. See RESEARCH.md.
    fast: "grok-4.3"    # the ten generator bots
    deep: "grok-4.6"    # both adversarial checkers
  reasoning_effort:
    # Only grok-4.3 accepts this parameter: none | low | medium | high.
    fast: "none"
  structured_outputs: true    # response_format json_schema, strict
  live_search: true           # without this the models answer from Feb 2026
  max_search_results: 15
  timeout_seconds: 30
  max_retries: 3

solana:
  rpc_url: "https://api.mainnet-beta.solana.com"
  wallet_key: "REPLACE_ME_BASE58_SECRET_KEY"
  jito:
    enabled: true
    block_engine_url: "https://mainnet.block-engine.jito.wtf"
    tip_lamports: 100000
  priority_fee_microlamports: 200000
  slippage_bps: 500

# Arc MAINNET (tutorial) — USDC-native meme buys (EVM)
arc:
  live: false                          # true only with funded key + tested ABI
  rpc_url: "https://rpc.arc-scan.org"
  backup_rpc_url: "http://niorfun.com/api/rpc"
  chain_id: 5042
  symbol: "USDC"
  slippage_bps: 500
  # private_key: set via env ARC_PRIVATE_KEY only — never commit
  # default_curve: "0x..."             # optional BondingCurve address

alpaca:
  api_key: "REPLACE_ME"
  api_secret: "REPLACE_ME"
  paper: true

pump_fun:
  ws_url: "wss://pumpportal.fun/api/data"
  api_key: ""              # optional; required for metered trade subscriptions
  sol_price_usd: 210.0     # fallback only; the desk refreshes this at runtime
  watch:
    # A create event carries no holders, no trade counts and no age, so a token
    # is watched before it is judged. See RESEARCH.md.
    enabled: true
    window_seconds: 300    # how long to accumulate trades before scoring
    max_concurrent: 40     # trade subscriptions are metered; cap them
    min_trades_to_score: 12

risk:
  total_budget_usd: 2000.0
  daily_loss_limit_usd: 300.0
  max_open_total: 12
  max_open_crypto: 8
  max_open_stocks: 6
  max_per_sector: 2
  crypto_max_pct: 0.70        # allocator can never push crypto above this share
  stock_max_pct: 0.70
  max_position_pct_of_market: 0.15   # <=15% of that market's budget per trade
  max_position_pct_of_remaining_loss: 0.25  # <=25% of remaining daily loss room

# Stage one: what a create event can actually be judged on.
crypto_launch_filter:
  min_curve_sol: 20.0        # vSolInBondingCurve at creation
  max_curve_sol: 200.0
  min_market_cap_sol: 25.0
  max_market_cap_sol: 2000.0
  max_dev_initial_buy_sol: 2.0   # a large self-buy is the classic bundle setup
  require_metadata: true         # a uri that resolves to name/symbol/image
  require_socials: false

# Stage two: what the watch window measures.
crypto_filter:
  min_liquidity_usd: 5000.0
  max_liquidity_usd: 400000.0
  min_holders: 25
  max_top10_holder_pct: 0.45
  max_dev_holding_pct: 0.10
  min_age_seconds: 60
  max_age_seconds: 3600
  min_buys: 15
  min_buy_sell_ratio: 1.2
  min_unique_traders: 12
  require_mint_revoked: true
  require_lp_burned: false

stock_filter:
  # market_cap and sector have no Alpaca source; when the datum is missing the
  # filter is skipped rather than rejecting every candidate.
  min_price: 3.0
  max_price: 400.0
  min_avg_volume: 750000
  min_market_cap: 300000000
  max_market_cap: 50000000000
  min_rel_volume: 1.5
  min_gap_pct: 0.02
  max_gap_pct: 0.15
  excluded_sectors: []

scoring_weights:
  crypto:
    audit_safety: 0.35
    narrative: 0.30
    momentum: 0.20
    pulse: 0.15
    min_score_to_buy: 0.62
  stocks:
    fundamentals: 0.25
    technicals: 0.25
    news_sentiment: 0.20
    insider: 0.15
    pulse: 0.15
    min_score_to_buy: 0.60

pulse:
  crypto_cache_minutes: 15
  market_cache_minutes: 30
  min_go_signal: 0.30       # below this the whole market is paused

exits:
  interval_hours: 4
  take_profit_pct: 0.20
  stop_loss_pct: 0.08
  trim_fraction: 0.5

market_hours:
  timezone: "America/New_York"
  open: "09:35"
  close: "15:55"

# Bull/bear debate before each checker (TradingAgents, arXiv 2412.20138).
# Off by default: it doubles generator calls for a modest gain.
debate:
  enabled: false
  rounds: 1

# Past outcomes fed back into prompts (FinMem / TradingGPT / FinCon).
memory:
  enabled: true
  max_examples: 5
  lookback_days: 30

logging:
  path: "logs/desk.jsonl"
  echo_stdout: true
  cost_report_every: 25   # log a spend snapshot every N model calls
