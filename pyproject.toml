[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miki-crypto-bot"
version = "0.1.0"
description = "Arc mainnet desk. Five robots, Warp curves, 1 USDC cap."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "miki"}]
dependencies = [
    "streamlit",
    "numpy",
    "pyyaml",
    "websockets",
    "httpx",
    "web3",
]

[tool.setuptools.packages.find]
include = ["desk_realtime*"]
